name: Feature request
description: Suggest a QCALVIEW workflow or capability.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the workflow or problem to solve rather than only the desired UI.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Project type, QGIS workflow, expected output and any relevant constraints.
